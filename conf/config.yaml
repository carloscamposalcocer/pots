# Pot generator settings. Override anything on the command line, e.g.
#   python make_pot.py height=65 quality=draft pattern=coral design.wall=4
defaults:
  - quality: full
  - _self_

pattern: voronoi_taper   # gyroid, diamond, voronoi, voronoi_taper, hex, coral, slots
height: 50              # mm; radii, cup and cells-around scale with it (130 = reference shape)
preview: true            # also render the PNG preview
out: output/${pattern}_h${height}   # config.yaml with these settings is saved here too

# Print-physics sizes in mm. These do NOT scale with height.
design:
  wall: 6.0              # pot wall thickness
  rim: 5.0               # solid band at the top
  base: 2.4              # solid floor shared by pot and cup
  cup_wall: 2.4
  strut_in: 2.2          # voronoi_taper strut width, soil side
  strut_out: 1.1         # voronoi_taper strut width, outside (>= ~1.1 for a 0.4 nozzle)

