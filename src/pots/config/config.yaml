# =====================================================================
# Plant pot generator settings (read by the pots command through Hydra).
#
# Every value here is a default: override any of them on the command
# line with key=value, no need to edit this file.
#   pots size=small                # the 50 mm pot
#   pots quality=full              # print-quality mesh (default: draft)
#   pots size=small height=65      # start from a preset, change one value
#   pots --show                    # print the final settings, no build
# See README.md for the full description of each parameter.
# =====================================================================

defaults:
  # This file first, so the size preset below can override it.
  - _self_
  # Mesh quality preset: `draft` (default, fast check, too coarse to
  # print) or `full` (the file you print). Files in config/quality/.
  - quality: draft
  # Pot size preset: `big` (100 mm) or `small` (50 mm), files in
  # config/size/. Sets `height` and `design.wall`.
  - size: big
  # Settings of every wall pattern (cell size, struts, ...), one block per
  # pattern: config/patterns.yaml. Override as patterns.<name>.<key>=value.
  - patterns

# ---------------------------------------------------------------------
# pattern: the perforation/lattice used for the pot wall.
#   voronoi   organic cells that flare outward like funnels: small holes
#             on the soil side, big ones outside (default, best air/soil
#             balance).
#   hex       warped honeycomb, pointy-top cells, flaring outward like
#             voronoi.
#   drops     staggered teardrops flaring outward like voronoi.
#   lattice   diamond trellis of crossing helical strips, flaring outward
#             like voronoi.
#   isogrid   triangle grid, flaring outward like voronoi.
#   louvers   gills sloping down and out: no line of sight, soil stays in,
#             rain runs off.
#   slots     narrow wavy vertical slots, air-pruning style.
#   spiral    slots on a many-start helix.
#   chevrons  stacked arrowhead slots.
#   weave     3D: strips woven over and under through the wall.
# ---------------------------------------------------------------------
pattern: voronoi

# ---------------------------------------------------------------------
# shape: profile of the pot body. Every shape stays between the same
# narrowest and widest radius (56 and 72 mm on the 130 mm pot), so every
# pattern prints the same on all of them, and no wall leans more than
# 24 degrees. The cup lip always sits just outside the widest part of
# the pot above it, so drips land in it.
#   tapered    cone, narrow at the bottom (default).
#   straight   cylinder.
#   bowl       flares fast low down, near vertical at the rim.
#   tulip      near vertical low down, flares out at the rim.
#   barrel     bulges out a little above mid-height, narrower rim.
#   hourglass  narrow waist a little below mid-height.
# ---------------------------------------------------------------------
shape: tapered

# height (mm) comes from the size preset (config/size/); see there.

# mesher: how the mesh is made.
#   auto  exact geometry (flat faces, sharp edges, fewer triangles, a
#         few seconds) for the patterns that support it (voronoi, hex,
#         drops, lattice, isogrid), marching cubes at quality.voxel /
#         quality.faces for the others.
#   sdf   marching cubes for every pattern (the old way, for comparison).
mesher: auto

# preview: also render a PNG (outside view, cut-away, vertical section,
# and both wall faces at true scale with their open %). Costs ~10 s.
preview: true

# out: output folder. It gets the .stl, the .3mf, the .png and a
# config.yaml with the exact settings used, all named
# <pattern>_<shape>_h<height>. ${pattern}, ${shape} and ${height} are
# filled in automatically; an existing folder is overwritten.
out: output/${pattern}_${shape}_h${height}

# ---------------------------------------------------------------------
# design: print-physics sizes in mm. They stay the same at every height
# because they depend on the printer (nozzle, layer bridging) and on the
# soil, not on how big the pot is.
# ---------------------------------------------------------------------
design:
  # wall (pot wall thickness) comes from the size preset (config/size/).

  # Solid band at the top of the pot (no holes). Gives the rim its
  # stiffness and a clean edge to hold.
  rim: 5.0

  # Solid floor shared by the pot and the cup. The soil sits directly on
  # it and wicks water from the cup. The pattern starts 1 mm above it.
  base: 2.4

  # Wall thickness of the plain drip cup around the bottom.
  cup_wall: 2.4

  # Solid layer on the soil side of the wall, behind the pattern (mm).
  # Where it is, the holes become blind pockets: the pattern still shows
  # outside, but water poured on the soil can't run out through the wall.
  # 1.6 mm = 4 perimeters of a 0.4 mm nozzle. 0 = holes go right through.
  skin: 1.6

  # How much of the pot height, measured from the top, gets the skin
  # (0 to 1). Below it the holes stay open, for air and so extra water
  # drains into the cup. 0.67 = the top two thirds are closed.
  skin_frac: 0.67

# ---------------------------------------------------------------------
# clips: optional wall mount. Two small pads on the back of the pot, one
# on the cup and one at the top, each with a T-slot. Drive two screws
# into the wall, one above the other, `spacing` apart (the build log
# prints the number) and leave their heads standing off the wall; then
# hold the pot with both heads at the open bottoms of the slots, push it
# flat and slide it down. The upper slot ends in a flat seat that carries
# the pot; the lower slot runs right through, so it only keeps the bottom
# against the wall and a few mm of drilling error cost nothing. Lift the
# pot straight up to take it off again.
#
# The pads are the only part that touches the wall. Every size is in mm
# and none of them scale with the pot (screws don't); only how far the
# pot slides is limited by the height of the cup, which does scale, so
# clips need a pot of about 46 mm or taller (the log says if the slide
# had to be shortened).
# ---------------------------------------------------------------------
clips:
  # enable: add the two pads. Off by default (a plain pot to stand up).
  enable: false

  # Screw shank diameter (mm): the slot in the back face is this plus
  # `clear` wide, and the pot hangs on the shank of the upper screw.
  screw: 4.0

  # Screw head: diameter and thickness (mm). Must be wider than the
  # shank; the recess behind the lips is this plus `clear`. Measure the
  # screws you have (a 4 mm wall screw or a #8 is about 8-9 x 3 mm).
  head: 9.0
  head_h: 3.0

  # Clearance around the screw (mm): added to every slot size.
  clear: 0.6

  # Lips (mm): the material between the head and the wall, measured from
  # the back face of the pad. They trap the head. The screws have to
  # stand `lip` + `head_h` to `lip` + `head_h` + `clear` off the wall.
  lip: 2.0

  # Pad width around the pot (mm). Bigger = stiffer mount, more plastic.
  width: 16.0

  # 45 degree break on the pads' outside edges (mm): where the back face
  # meets the top and the sides, and where the top meets the sides. 0
  # leaves them sharp. It has to stay clear of the slot, so it can be at
  # most (width - head - clear) / 2 and at most lip + 2.
  chamfer: 1.0

  # How far the pot slides down to seat (mm). Clamped to what the cup
  # leaves room for on a small pot.
  travel: 7.0

  # Where the pads sit around the pot, in degrees. 180 puts them
  # opposite the preview's front view.
  at: 180.0

# Pattern settings (cell size, strut widths, ...): config/patterns.yaml.
