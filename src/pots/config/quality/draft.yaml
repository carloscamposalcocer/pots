# Quick low-res test, to check a shape or setting before a full build.
# The default (quality=draft). Not meant for printing: struts are
# coarse; use quality=full for the file you print.

# voxel (mm): mesh grid spacing (see full.yaml). 0.6 has 8x fewer voxels
# than 0.3: about 1 min for a 130 mm pot.
voxel: 0.6

# faces: triangle budget of the final mesh.
faces: 100000
