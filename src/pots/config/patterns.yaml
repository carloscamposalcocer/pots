# =====================================================================
# Wall pattern settings: one block per pattern. Only the block of the
# selected `pattern` is used.
#
# Override on the command line like any other setting:
#   pots pattern=lattice patterns.lattice.strut_in=2.5
#   pots pattern=voronoi patterns.voronoi.seed=3
#
# Units are mm unless noted.
#   cells      number of cells around the pot at the 130 mm reference
#              height. It scales with height (rounded to an integer, so
#              the pattern stays seamless) and cells keep their size in
#              mm, so more cells = smaller holes.
#   strut_in   tapered patterns: strut width on the soil side. Wider =
#              smaller holes inside = less soil loss, less air. Keep it
#              >= ~1.1 (thinnest a 0.4 mm nozzle prints reliably).
#   strut_out  tapered patterns: strut width on the outer face, <= strut_in
#              so the holes widen outward like funnels. The strut is a
#              wedge through the wall, so its outer edge may be thinner
#              than the nozzle: the slicer just drops the tip, which makes
#              the outside holes a little bigger.
#   center     tapered patterns: 0 (default) keeps every hole roof where
#              it is from the soil side out, so the holes grow only
#              sideways and downward and each roof is a level bridge or a
#              steady slope. 1 moves the soil-side pattern down so each
#              hole is centred on its outside opening, growing evenly all
#              round. In between = partly. Above 0 the roofs rise toward
#              the outside: voronoi, hex and isogrid have flat bridge roofs,
#              which then become sloped ceilings that can sag (pots warns).
#
# The open % and hole sizes noted below are for the 100 mm pot (6 mm
# wall), outer face / soil side.
#
# Not here on purpose: the 55-degree roof slope and the warp frequencies,
# which keep the pot support-free and seamless.
# =====================================================================
patterns:
  voronoi:
    cells: 76         # 76 -> ~5.3 mm wide cells
    row_h: 5.2        # row height
    jitter: 0.30      # randomness of the cell centres, fraction of a cell (0 = regular grid, keep < 0.5)
    seed: 7           # random seed: another number gives another cell layout
    warp: 1.2         # sideways wobble of the cells (amplitude)
    strut_in: 2.2     # -> ~29% open, ~2.5 mm holes on the soil side
    strut_out: 0.5    # -> ~78% open, ~4.2 mm holes outside (1.1 -> ~58%, ~3.6 mm)
    center: 1.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file

  hex:
    cells: 84         # 84 -> ~4.8 mm flat-to-flat cells
    strut_in: 2.2     # -> ~25% open, ~2.2 mm holes
    strut_out: 1.1    # -> ~52% open, ~3.2 mm holes
    center: 0.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file
    strut_extra: 0.2  # added to every strut: the warp shears the cells and thins some struts
    warp: 1.6
    warp_z: 1.0

  drops:
    cells: 70
    row: 1.05         # row height, as a fraction of the cell width
    strut_in: 2.2     # -> ~34% open, ~3.4 mm holes
    strut_out: 1.1    # -> ~56% open, ~4.4 mm holes
    center: 1.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file

  lattice:
    cells: 72         # 72 -> strips 4.6 mm apart
    strut_in: 3.0     # -> ~13% open, ~1.6 mm holes on the soil side (2.2 -> ~27%, ~2.3 mm)
    strut_out: 0.3    # -> ~85% open, ~4.1 mm holes outside (1.1 -> ~57%, ~3.3 mm)
    center: 1.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file

  isogrid:
    cells: 54         # 54 -> ~7.4 mm triangle sides
    strut_in: 2.2     # -> ~24% open, ~2.1 mm holes
    strut_out: 0.3    # -> ~85% open, ~3.8 mm holes
    center: 1.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file

  louvers:
    cells: 29         # slits per row
    pitch: 5.0        # row spacing
    slit_h: 2.4       # slit height
    rib: 2.0          # solid between the slits of one row
    drop: 1.2         # the slit drops this much per mm of wall; keep drop * wall > slit_h (no line of sight)

  slots:
    cells: 60
    row_h: 22.0       # row height (slot length + solid between rows)
    width: 2.2
    length: 17.0      # including the pointed ends
    warp: 2.2         # sideways wobble (amplitude)

  spiral:
    cells: 80         # helices around the pot (rounded to an even number)
    angle: 60         # helix angle from horizontal, degrees; keep >= 45
    width: 2.2
    length: 16.0
    gap: 3.0          # solid between slots along one helix

  chevrons:
    cells: 30
    arm: 8.0          # arm length
    width: 2.0
    row_h: 6.8        # row spacing

  weave:
    cells: 60
    width: 3.2        # ribbon width

  # ---- fractal patterns. Several levels of the same shape at halving sizes.
  # strut_in / strut_out are the finest level's struts; each coarser level's
  # are `vein` times wider.

  sierpinski:
    cells: 36         # big triangles around the pot: 36 -> ~11 mm sides
    levels: 3         # hole sizes: 11, 5.6, 2.8 mm triangles (the smallest only open outside)
    strut_in: 2.2
    strut_out: 0.5
    center: 1.0       # 0 = roofs level, holes grow downward; 1 = holes centred (soil side moved down); see top of file

  trellis:
    cells: 36         # coarsest diamonds around the pot: 36 -> strips 11 mm apart
    split: [1.0, 0.45]  # chance a diamond splits into four at each finer level (one entry per level)
    strut_in: 1.3     # finest strips; the coarser ones are 1.7 and 2.2 mm
    strut_out: 0.4
    vein: 1.3         # each coarser level's strips are this much wider
    seed: 5
    center: 1.0

  veins:
    cells: 23         # coarsest cells around the pot: 23 -> ~17 mm; then 8.7, 4.4 mm
    levels: 3
    row: 0.95         # row height, as a fraction of the cell width
    jitter: 0.35
    seed: 11
    warp: 1.2
    strut_in: 1.2     # finest struts; the veins are 1.8 and 2.7 mm
    strut_out: 0.5
    vein: 1.5
    center: 0.0       # 0 = roofs level (flat bridges); 1 = centred, the bridges then slope (pots warns)

  roots:
    cells: 20         # trees around the pot: 20 -> 20 mm apart
    row_h: 22.0       # tree rows (staggered)
    trunk: 5.0        # trunk length; each fork is `ratio` times shorter
    ratio: 0.9
    levels: 6         # trunk + 5 forks
    spread: 24        # degrees each branch turns at a fork
    max_angle: 34     # branches stay within this of vertical: slot sides >= 56 degrees
    width_in: 2.2     # trunk slot width on the soil side; each fork `thin` times narrower
    width_out: 3.0    # ... and outside
    thin: 0.85
    gap: 0.9          # minimum wall between slots that don't join (outer face)
    jitter: 0.25      # randomness of lengths and angles
    variants: 5       # different trees (plus their mirror images)
    seed: 3

  bubbles:
    radius: 3.0       # biggest cells (the holes are a strut smaller), mm
    ratio: 0.6        # each size is this much smaller: 3.0, 1.8, 1.1 mm
    levels: 3
    jitter: 0.4       # randomness of the candidate positions, fraction of their grid
    spread: 0.15      # randomness of the sizes (+- fraction)
    seed: 2
    strut_in: 2.2
    strut_out: 0.6
    center: 1.0
