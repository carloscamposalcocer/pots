[project]
name = "pots"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos Campos", email = "carlos.campos@reeldata.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "fast-simplification>=0.2.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pymeshfix>=0.18.1",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "trimesh>=5.1.0",
]

[project.scripts]
pots = "pots:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
